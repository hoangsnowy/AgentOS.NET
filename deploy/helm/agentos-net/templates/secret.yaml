{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.secretName" . }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  annotations:
    # Keep generated credentials when the release is uninstalled — they protect the data in the volumes.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ include "agentos.secretValue" (dict "root" . "key" "postgres-password" "value" $s.postgresPassword) | b64enc | quote }}
  keycloak-admin-password: {{ include "agentos.secretValue" (dict "root" . "key" "keycloak-admin-password" "value" $s.keycloakAdminPassword) | b64enc | quote }}
  keycloak-web-client-secret: {{ include "agentos.secretValue" (dict "root" . "key" "keycloak-web-client-secret" "value" $s.keycloakWebClientSecret) | b64enc | quote }}
  operator-password: {{ include "agentos.secretValue" (dict "root" . "key" "operator-password" "value" $s.operatorPassword) | b64enc | quote }}
  {{- with $s.memberPassword }}
  member-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.smtpPassword }}
  smtp-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.dataProtectionCertificatePassword }}
  dataprotection-certificate-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
