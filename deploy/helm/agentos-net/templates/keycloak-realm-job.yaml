{{- if .Values.keycloak.configureRealm }}
{{- $secret := include "agentos.secretName" . -}}
# Points the `agentic` realm at this install after every install/upgrade (files/configure-realm.sh — the
# same script docker compose runs): redirect URIs, client secrets, the agentos-admin service account,
# verifyEmail, platform-admin, and (first run only) the seed users.
# Runs kcadm.sh from the AgentOS.NET Keycloak image, so it needs nothing from the internet.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentos.component" (dict "root" . "name" "realm") }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: realm-config
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentos.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: realm-config
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "agentos.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
      containers:
        - name: configure-realm
          image: {{ include "agentos.image" (dict "root" . "image" .Values.keycloak.image) }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          command: ["/bin/bash", "/scripts/configure-realm.sh"]
          env:
            - name: KEYCLOAK_URL
              value: {{ include "agentos.keycloakInternalUrl" . | quote }}
            - name: REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: WEB_PUBLIC_URL
              value: {{ include "agentos.webUrl" . | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUsername | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: keycloak-admin-password }
            - name: KEYCLOAK_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: keycloak-web-client-secret }
            - name: ADMIN_CLIENT_ID
              value: {{ .Values.keycloak.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: keycloak-admin-client-secret }
            - name: OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: operator-password }
            - name: MEMBER_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: member-password, optional: true }
            - name: KC_SMTP_HOST
              value: {{ .Values.keycloak.smtp.host | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            {{- include "agentos.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: scripts
          configMap:
            name: {{ include "agentos.component" (dict "root" . "name" "scripts") }}
            items:
              - key: configure-realm.sh
                path: configure-realm.sh
{{- end }}
